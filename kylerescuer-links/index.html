<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle Rescuer · Links</title>
  <meta name="description" content="Making a difference in the lives of more than 400 dogs and cats.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Nunito", sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 24px 52px;
    }

    .lk {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Avatar ── */
    .lk-avatar {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 28px rgba(0,0,0,0.10);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
      flex-shrink: 0;
    }
    .lk-avatar img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
    }

    /* ── Description ── */
    .lk-desc {
      font-size: 1.05rem;
      font-weight: 600;
      color: #6b6b6b;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 360px;
    }

    /* ── Buttons ── */
    .lk-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 36px;
    }

    .lk-btn {
      width: 100%;
      height: 58px;
      border-radius: 999px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: "Nunito", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s ease, transform 0.15s ease;
      letter-spacing: 0.01em;
    }
    @media (hover: hover) {
      .lk-btn:hover { transform: translateY(-1px); }
      .lk-btn-primary:hover { background: #A2041C; color: #fff; }
      .lk-btn-email:hover { background: #fff; color: #000; }
      .lk-btn-pix:hover { background: #1e7a3e; }
      .lk-btn-green:hover { background: #379140; color: #fff; }
    }
    .lk-btn:active { filter: brightness(0.96); transform: translateY(0); }
    .lk-btn svg { flex-shrink: 0; }

    /* Locks focus/active state so it doesn't inherit the WordPress theme color */
    .lk-btn:focus,
    .lk-btn:focus-visible,
    .lk-btn:active { outline: none !important; box-shadow: none !important; }

    /* Primary - red */
    .lk-btn-primary {
      background: #BF0521;
      color: #fff;
    }
    .lk-btn-primary:focus,
    .lk-btn-primary:focus-visible,
    .lk-btn-primary:active {
      background: #BF0521 !important; color: #fff !important; border-color: transparent !important;
    }

    /* Email - white, red border */
    .lk-btn-email {
      background: #fff;
      color: #1a1a1a;
      border: 1.5px solid #BF0521;
      font-weight: 800;
    }
    .lk-btn-email:focus,
    .lk-btn-email:focus-visible,
    .lk-btn-email:active {
      background: #fff !important; color: #1a1a1a !important; border-color: #BF0521 !important;
    }

    /* Pix - green */
